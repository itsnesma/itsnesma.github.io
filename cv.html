    :root{--bg:oklch(15.5% .004 70);--ink:oklch(94% .004 80);--body:oklch(76% .004 80);--faint:oklch(60% .004 80);--rule:oklch(27% .004 70);--wash:oklch(20% .004 70);

    pin: '<path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>'
  };
  const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.globe}</svg>`;

  // DNA placeholder avatar: a tiny helix of coloured base pairs
  function dnaAvatar() {
    const cols = ['var(--dna-a)', 'var(--dna-t)', 'var(--dna-g)', 'var(--dna-c)'];
    let out = '';
    for (let i = 0; i < 11; i++) {
      const y = 12 + i * 8, ph = i * .62, x1 = 56 + Math.sin(ph) * 26, x2 = 56 - Math.sin(ph) * 26;
      out += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${cols[i % 4]}" stroke-width="3" stroke-linecap="round" opacity="${.45 + .5 * Math.abs(Math.cos(ph))}"/>`;
      out += `<circle cx="${x1}" cy="${y}" r="3.2" fill="var(--ink)" opacity=".8"/><circle cx="${x2}" cy="${y}" r="3.2" fill="var(--faint)"/>`;
    }
    return `<svg viewBox="0 0 112 112" role="img" aria-label="DNA helix">${out}</svg>`;
  }
  function geneRule() {
    const c = ['var(--dna-g)', 'var(--dna-c)', 'var(--dna-a)', 'var(--dna-t)'];
    return `<svg class="gene" viewBox="0 0 120 8" aria-hidden="true"><line x1="0" y1="4" x2="120" y2="4" stroke="var(--rule)" stroke-width="1.2"/>
      <rect x="0" y="1" width="22" height="6" rx="1" fill="${c[0]}"/><rect x="32" y="1" width="12" height="6" rx="1" fill="${c[1]}"/>
      <rect x="56" y="1" width="28" height="6" rx="1" fill="${c[2]}"/><rect x="96" y="1" width="16" height="6" rx="1" fill="${c[3]}"/></svg>`;
  }

  const R = RESUME;
  const header = `
    <header>
      <div class="who">
        <h1 id="resume-name">${esc(R.name)}</h1>
        ${geneRule()}
        <p class="about">${esc(R.about)}</p>
        <p><a class="loc" href="${esc(R.locationLink)}" target="_blank" rel="noopener noreferrer" aria-label="Location: ${esc(R.location)}">${icon('pin')}${esc(R.location)}</a></p>
        <ul class="socials" aria-label="Contact links">${R.contact.map(c => `<li><a href="${esc(c.href)}" aria-label="${esc(c.label)}" title="${esc(c.label)}" target="_blank" rel="noopener noreferrer">${icon(c.icon)}</a></li>`).join('')}</ul>
        <div class="print-contact">${R.contact.map((c, i) => `<span><a href="${esc(c.href)}">${esc(c.text)}</a>${i < R.contact.length - 1 ? ' <span aria-hidden="true">/</span>' : ''}</span>`).join('')}</div>
      </div>
      ${R.avatar ? `<img class="avatar" src="${esc(R.avatar)}" alt="${esc(R.name)}'s profile picture" width="112" height="112">` : `<div class="avatar">${dnaAvatar()}</div>`}
    </header>`;

  const RENDER = {
    summary: () => sec('summary', `<p class="summary">${esc(R.summary)}</p>`),
    work: () => sec('work', `<div class="stack-8">${R.work.map(w => `
      <article>
        <div class="row"><h3>${ext(w.company, w.link)}</h3>${dates(w.start, w.end)}</div>
        <h4>${esc(w.title)}</h4>
        <div class="desc">${esc(w.description)}${w.highlights?.length ? `<ul>${w.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}</div>
        ${tags(w.badges)}
      </article>`).join('')}</div>`),
    education: () => sec('education', `<div class="stack-8">${R.education.map(e => `
      <article>
        <div class="row"><h3>${ext(e.degree, e.link)}</h3>${dates(e.start, e.end)}</div>
        <h4>${esc(e.school)}</h4>
        ${e.highlights?.length ? `<div class="desc"><ul>${e.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
      </article>`).join('')}</div>`),
    grants: () => sec('grants', `<div class="stack-4">${R.grants.map(e => `
      <article><div class="row"><h3>${esc(e.degree)}</h3>${dates1(e.start, e.end)}</div><div class="desc">${esc(e.school)}</div></article>`).join('')}</div>`),
    publications: () => sec('publications', pubList(R.publications)),
    inprogress: () => sec('inprogress', pubList(R.inprogress)),
    presentations: () => sec('presentations', pubList(R.presentations)),
    languages: () => sec('languages', tags(R.languages, 'skills')),
    interests: () => sec('interests', `<p class="summary">${esc(R.interests)}</p>`),
    skills: () => sec('skills', tags(R.skills, 'skills')),
    projects: () => sec('projects', `<div class="projects">${R.projects.map(p => `
      <article><h3>${ext(p.title, p.link)}</h3>${p.link ? `<a class="proj-url" href="${esc(p.link)}">${esc(disp(p.link))}</a>` : ''}<p>${esc(p.description)}</p>${tags(p.techStack)}</article>`).join('')}</div>`)
  };

  const root = document.getElementById('resume');
  root.innerHTML = [header, ...R.sections.map(k => RENDER[k]?.() || '')]
    .map((html, i) => `<div class="fade" style="animation-delay:${i * 75}ms">${html}</div>`).join('');

  if (/[?&]print\b/.test(location.search)) addEventListener('load', () => setTimeout(() => print(), 400));

  // structured data for search engines
  const ld = document.createElement('script'); ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Person', name: R.name, description: R.about,
    url: R.contact.find(c => c.icon === 'globe')?.href, sameAs: R.contact.filter(c => !/^mailto:/.test(c.href)).map(c => c.href) });
  document.head.appendChild(ld);

  /* ---------------- command menu ---------------- */
  const isMac = navigator.userAgent.includes('Mac');
  document.getElementById('kmod').textContent = isMac ? '⌘' : 'Ctrl+';
  const overlay = document.getElementById('overlay'), input = document.getElementById('cmdInput'),
        list = document.getElementById('cmdList'), empty = document.getElementById('cmdEmpty');
  const ITEMS = [
    { group: 'Actions', label: 'Print / save as PDF', run: () => { close(); setTimeout(() => print(), 50); } },
    { group: 'Actions', label: 'Back to nesma', run: () => { location.href = './'; }, hide: document.documentElement.classList.contains('embed') },
    ...R.contact.filter(c => c.icon !== 'mail').map(c => ({ group: 'Links', label: c.label, run: () => { close(); open(c.href, '_blank', 'noopener,noreferrer'); } })),
    ...R.contact.filter(c => c.icon === 'mail').map(c => ({ group: 'Links', label: `Email ${c.text}`, run: () => { close(); location.href = c.href; } }))
  ].filter(i => !i.hide);
  let shown = [], sel = 0, lastFocus = null;

  function renderList() {
    const q = input.value.trim().toLowerCase();
    shown = ITEMS.filter(i => !q || i.label.toLowerCase().includes(q) || i.group.toLowerCase().includes(q));
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    let html = '', g = '';
    shown.forEach((it, i) => {
      if (it.group !== g) { g = it.group; html += `<div class="grp">${g}</div>`; }
      html += `<button class="item${i === sel ? ' sel' : ''}" data-i="${i}" role="option" aria-selected="${i === sel}">${esc(it.label)}</button>`;
    });
    list.innerHTML = html;
    empty.style.display = shown.length ? 'none' : 'block';
  }
  function openMenu() { lastFocus = document.activeElement; overlay.classList.add('open'); input.value = ''; sel = 0; renderList(); input.focus(); }
  function close() { overlay.classList.remove('open'); lastFocus?.focus?.({ preventScroll: true }); }
  list.addEventListener('mousemove', e => { const b = e.target.closest('.item'); if (b && +b.dataset.i !== sel) { sel = +b.dataset.i; renderList(); } });
  list.addEventListener('click', e => { const b = e.target.closest('.item'); if (b) shown[+b.dataset.i].run(); });
  input.addEventListener('input', () => { sel = 0; renderList(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = (sel + 1) % shown.length; renderList(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = (sel - 1 + shown.length) % shown.length; renderList(); e.preventDefault(); }
    if (e.key === 'Enter' && shown[sel]) shown[sel].run();
  });
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
  document.getElementById('cmdClose').addEventListener('click', close);
  document.getElementById('cmdFab').addEventListener('click', openMenu);
  // when embedded in the site's cv tab, tell the parent page how tall we are
  if (document.documentElement.classList.contains('embed') && parent !== window) {
    const send = () => parent.postMessage({ cvHeight: document.documentElement.scrollHeight }, '*');
    new ResizeObserver(send).observe(document.body); addEventListener('load', send); send();
  }
  addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'j' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); overlay.classList.contains('open') ? close() : openMenu(); }
    if (e.key === 'Escape' && overlay.classList.contains('open')) close();
  });
})();
</script>
</body>
</html>
